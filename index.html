<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="上班赚钱">
<title>上班赚钱</title>
<style>
:root{--green:#16a34a;--dark:#0f172a;--muted:#64748b;--bg:#f4f8f5;--card:#fff;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:linear-gradient(145deg,#ecfdf5,#eff6ff);color:var(--dark);padding:calc(18px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}.app{max-width:680px;margin:auto}.top{text-align:center;padding:10px 0 18px}.top h1{margin:0;font-size:28px}.top p{margin:7px 0 0;color:var(--muted);font-size:14px}.card{background:rgba(255,255,255,.96);border:1px solid rgba(226,232,240,.85);border-radius:22px;padding:20px;box-shadow:0 12px 35px rgba(15,23,42,.08);margin-bottom:14px}.hero{text-align:center;background:linear-gradient(135deg,#f0fdf4,#dcfce7)}.eyebrow{font-size:13px;color:#15803d;font-weight:700}.money{font-size:45px;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums;margin:4px 0}.rate{font-size:13px;color:var(--muted)}.status{display:inline-block;margin-top:10px;padding:6px 11px;border-radius:99px;background:#fff;color:#166534;font-weight:700;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.stat{background:#f8fafc;border-radius:14px;padding:12px 7px;text-align:center}.stat small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.stat b{font-size:16px;font-variant-numeric:tabular-nums}.barbg{height:10px;background:#dbe4ee;border-radius:99px;overflow:hidden;margin-top:17px}.bar{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#14b8a6);transition:width .4s}.barlabels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}.section-title{font-size:17px;margin:0 0 14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#475569;font-size:12px;font-weight:700}input{width:100%;margin-top:6px;border:1px solid #cbd5e1;border-radius:11px;background:#fff;padding:11px;font-size:16px;color:var(--dark)}input:focus{outline:3px solid rgba(34,197,94,.16);border-color:#22c55e}.full{grid-column:1/-1}.hint{font-size:11px;line-height:1.6;color:var(--muted);margin:12px 0 0}.holiday{display:flex;align-items:flex-start;gap:10px;padding:12px;background:#f8fafc;border-radius:13px;font-size:12px;color:#475569;line-height:1.55}.dot{min-width:9px;height:9px;background:#22c55e;border-radius:50%;margin-top:5px}.msg{text-align:center;color:#475569;font-weight:700;font-size:13px}.privacy{text-align:center;font-size:11px;color:var(--muted);padding:4px 10px}.reset{width:100%;border:0;border-radius:11px;padding:11px;background:#eef2f7;color:#475569;font-weight:700;cursor:pointer}@media(max-width:480px){.card{padding:17px}.money{font-size:39px}.grid{gap:6px}.stat b{font-size:14px}.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body><main class="app">
<header class="top"><h1>💰 上班赚钱</h1><p id="dateText">正在读取日期</p></header>
<section class="card hero"><div class="eyebrow">今天已经赚了</div><div class="money">¥<span id="todayEarned">0.00</span></div><div class="rate">当前约 ¥<span id="perSecond">0.0000</span> / 秒</div><div class="status" id="status">正在计算</div><div class="grid"><div class="stat"><small>本月已赚</small><b>¥<span id="monthEarned">0.00</span></b></div><div class="stat"><small>本月工作日</small><b><span id="workdays">0</span> 天</b></div><div class="stat"><small>距离下班</small><b id="countdown">--:--:--</b></div></div><div class="barbg"><div id="bar" class="bar"></div></div><div class="barlabels"><span id="startLabel">09:00</span><span id="pct">0%</span><span id="endLabel">18:00</span></div></section>
<section class="card"><h2 class="section-title">⚙️ 我的设置</h2><div class="fields"><label class="full">每月税前工资（元）<input id="salary" type="number" min="0" inputmode="decimal" value="10000"></label><label>上班时间<input id="startTime" type="time" value="09:00"></label><label>下班时间<input id="endTime" type="time" value="18:00"></label><label>午休开始<input id="lunchStart" type="time" value="12:00"></label><label>午休结束<input id="lunchEnd" type="time" value="13:00"></label></div><p class="hint">修改后自动保存到当前手机或电脑的浏览器。午休时间不计入赚钱时长。</p></section>
<section class="card"><h2 class="section-title">📅 工作日规则</h2><div class="holiday"><span class="dot"></span><span><b>已内置 2026 年中国大陆法定节假日及调休。</b><br>其他年份默认按周一至周五计算。公司额外休假、年假、请假和加班暂不自动计入。</span></div></section>
<section class="card"><div id="msg" class="msg">今天也要快乐地把工资赚回来 ✨</div></section>
<button class="reset" id="resetSettings" type="button">恢复默认设置</button><p class="privacy">工资和时间仅保存在当前浏览器，不会上传到 GitHub，也不会发送到服务器。</p>
</main>
<script>
(()=>{const $=id=>document.getElementById(id),store='salaryApp_v3_';const defaultData={salary:'10000',startTime:'09:00',endTime:'18:00',lunchStart:'12:00',lunchEnd:'13:00'};Object.keys(defaultData).forEach(id=>{const saved=localStorage.getItem(store+id);$(id).value=saved??defaultData[id];$(id).addEventListener('input',()=>{localStorage.setItem(store+id,$(id).value);render()})});
const OFF=new Set(['2026-01-01','2026-01-02','2026-01-03','2026-02-15','2026-02-16','2026-02-17','2026-02-18','2026-02-19','2026-02-20','2026-02-21','2026-02-22','2026-02-23','2026-04-04','2026-04-05','2026-04-06','2026-05-01','2026-05-02','2026-05-03','2026-05-04','2026-05-05','2026-06-19','2026-06-20','2026-06-21','2026-09-25','2026-09-26','2026-09-27','2026-10-01','2026-10-02','2026-10-03','2026-10-04','2026-10-05','2026-10-06','2026-10-07']);
const ON=new Set(['2026-01-04','2026-02-14','2026-02-28','2026-05-09','2026-09-20','2026-10-10']);
function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function mins(t){const a=t.split(':').map(Number);return a[0]*60+a[1]};function workday(d){const k=key(d);if(ON.has(k))return true;if(OFF.has(k))return false;return d.getDay()>0&&d.getDay()<6};function paidMinutes(){const s=mins($('startTime').value),e=mins($('endTime').value),ls=mins($('lunchStart').value),le=mins($('lunchEnd').value);let lunch=Math.max(0,Math.min(e,le)-Math.max(s,ls));return Math.max(1,e-s-lunch)}
function fraction(now){if(!workday(now))return 0;const s=mins($('startTime').value),e=mins($('endTime').value),ls=mins($('lunchStart').value),le=mins($('lunchEnd').value),n=now.getHours()*60+now.getMinutes()+now.getSeconds()/60,total=paidMinutes();if(n<=s)return 0;if(n>=e)return 1;let worked=Math.max(0,n-s);worked-=Math.max(0,Math.min(n,le)-Math.max(s,ls));return Math.min(1,Math.max(0,worked/total))}
function clock(sec){sec=Math.max(0,Math.floor(sec));return [Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(v=>String(v).padStart(2,'0')).join(':')}
function render(){const now=new Date(),salary=Math.max(0,Number($('salary').value)||0),last=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();let days=0,done=0;for(let i=1;i<=last;i++){const d=new Date(now.getFullYear(),now.getMonth(),i);if(workday(d)){days++;if(d.toDateString()!==now.toDateString()&&d<now)done++}}const pd=days?salary/days:0,frac=fraction(now),today=frac*pd,month=(done+frac)*pd,perSec=pd/(paidMinutes()*60);$('todayEarned').textContent=today.toFixed(2);$('monthEarned').textContent=month.toFixed(2);$('perSecond').textContent=perSec.toFixed(4);$('workdays').textContent=days;$('bar').style.width=(frac*100)+'%';$('pct').textContent=(frac*100).toFixed(1)+'%';$('startLabel').textContent=$('startTime').value;$('endLabel').textContent=$('endTime').value;$('dateText').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(now);const n=now.getHours()*60+now.getMinutes()+now.getSeconds()/60,s=mins($('startTime').value),e=mins($('endTime').value);let status,msg,left;if(!workday(now)){status='今天是休息日';msg='今天不搬砖，放心休息 🌿';left=null}else if(n<s){status='尚未上班';msg='距离开始赚钱还有一点时间';left=(e-s)*60}else if(n>=e){status='今日已下班';msg='今天的工资已全部赚到 🎉';left=0}else{status=(n>=mins($('lunchStart').value)&&n<mins($('lunchEnd').value))?'午休中':'正在赚钱';msg=status==='午休中'?'午休不计入工作时长 ☕':'现在每一秒都在增加 💰';left=Math.max(0,(e-n)*60)}$('status').textContent=status;$('msg').textContent=msg;$('countdown').textContent=left===null?'休息日':clock(left)}
$('resetSettings').addEventListener('click',()=>{if(confirm('确定恢复默认设置吗？')){Object.entries(defaultData).forEach(([id,v])=>{$(id).value=v;localStorage.removeItem(store+id)});render()}});render();setInterval(render,1000)})();
</script></body></html>
